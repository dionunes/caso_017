<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARQUIVO 017</title>

    <style>
        body {
            background: #111;
            color: #d6d6d6;
            font-family: monospace;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 30px;
            border: 1px solid #444;
            background: #181818;
        }

        .top {
            border-bottom: 1px solid #444;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .classified {
            font-size: 13px;
            color: #999;
        }

        .evidence {
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #333;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border: 1px solid #777;
            color: #ddd;
            text-decoration: none;
        }

        .button:hover {
            background: #333;
        }

        .warning {
            margin-top: 40px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <h1>ARQUIVO 017</h1>
        <div class="classified">
            SISTEMA DE INVESTIGAÇÃO — ACESSO RESTRITO
        </div>
    </div>

    <p>
        O acesso ao arquivo foi registrado.
    </p>

    <p>
        A primeira evidência encontra-se disponível abaixo.
    </p>

    <div class="evidence">

        <strong>EVIDÊNCIA 002</strong>

        <p>
            Status: PRESERVADA
        </p>

        <p>
            O conteúdo foi recuperado, mas permanece protegido.
        </p>

        <a class="button" href="#">
            ACESSAR EVIDÊNCIA
        </a>

    </div>

    <div class="warning">
        Registro automático ativo.
    </div>

</div>

</body>
</html>
